<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connection Failed</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      max-width: 480px;
      width: 90%;
    }
    h1 { color: #f43f5e; margin-bottom: 0.5rem; }
    p { color: #94a3b8; font-size: 0.95rem; }
    .badge {
      background: #334155;
      color: #38bdf8;
      font-family: monospace;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      display: inline-block;
      margin-top: 1rem;
      word-break: break-all;
    }
    button {
      margin-top: 1.5rem;
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Unable to Connect</h1>
    <p>The destination web server refused the connection or your internet device is offline.</p>
    <div id="errorDetails" class="badge">Checking connection status...</div>
    <br>
    <button onclick="retry()">Try Again</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const failedUrl = params.get('failedUrl') || '';
    const errorMsg = params.get('error') || 'CONNECTION_FAILED';

    document.getElementById('errorDetails').innerText = `${errorMsg}: ${failedUrl}`;

    function retry() {
      if (failedUrl) {
        window.location.href = failedUrl;
      } else {
        window.location.reload();
      }
    }
  </script>
</body>
</html>
